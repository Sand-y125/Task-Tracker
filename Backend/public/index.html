<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>User Management System</h1>

    <form id="userForm">

        <input type="hidden" id="userId">

        <input
            type="text"
            id="firstName"
            placeholder="First Name"
            required>

        <input
            type="text"
            id="lastName"
            placeholder="Last Name"
            required>

        <input
            type="email"
            id="email"
            placeholder="Email"
            required>

        <input
            type="password"
            id="password"
            placeholder="Password"
            required>

        <button type="submit">
            Save User
        </button>

    </form>

    <table>

        <thead>

            <tr>

                <th>ID</th>

                <th>First Name</th>

                <th>Last Name</th>

                <th>Email</th>

                <th>Actions</th>

            </tr>

        </thead>

        <tbody id="userTable">

        </tbody>

    </table>

</div>

<script src="script.js"></script>

</body>
</html>
